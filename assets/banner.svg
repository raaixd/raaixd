<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Glow for Graph Nodes -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <!-- Pattern Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>

    <style>
      @keyframes softPulse {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.05); }
      }
      @keyframes statusBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @keyframes lineFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      .pulsing-node {
        animation: softPulse 4s ease-in-out infinite;
        transform-origin: 820px 110px;
      }
      .pulsing-glow {
        animation: softPulse 4s ease-in-out infinite;
        transform-origin: 820px 110px;
      }
      .status-dot {
        animation: statusBlink 2.5s ease-in-out infinite;
      }
      .flowing-edge {
        stroke-dasharray: 6 6;
        animation: lineFlow 20s linear infinite;
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -0.5px;
        fill: #F8FAFC;
      }
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.2px;
        fill: #94A3B8;
      }
      .text-meta {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.3px;
        fill: #64748B;
      }
      .text-badge {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.8px;
        fill: #38BDF8;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="960" height="220" rx="12" fill="url(#bgGradient)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Background Subtle Grid -->
  <rect width="960" height="220" rx="12" fill="url(#grid)" />

  <!-- Top Ambient Glow Edge -->
  <path d="M 120 1 L 840 1" stroke="url(#accentGlow)" stroke-width="1.5" />

  <!-- Evidence Graph Decorative Motif (Right Side) -->
  <g opacity="0.85">
    <!-- Big ambient halo -->
    <circle cx="820" cy="110" r="70" fill="url(#nodeGlow)" class="pulsing-glow" />

    <!-- Graph Edges -->
    <line x1="710" y1="60" x2="770" y2="90" stroke="#334155" stroke-width="1.5" />
    <line x1="770" y1="90" x2="820" y2="110" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.7" class="flowing-edge" />
    <line x1="820" y1="110" x2="880" y2="80" stroke="#334155" stroke-width="1.5" />
    <line x1="820" y1="110" x2="850" y2="160" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" class="flowing-edge" />
    <line x1="750" y1="150" x2="820" y2="110" stroke="#334155" stroke-width="1.5" />
    <line x1="880" y1="80" x2="915" y2="130" stroke="#334155" stroke-width="1.2" />

    <!-- Satellite Nodes -->
    <circle cx="710" cy="60" r="4" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <circle cx="770" cy="90" r="5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="750" cy="150" r="4.5" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <circle cx="880" cy="80" r="4" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <circle cx="850" cy="160" r="5" fill="#0F172A" stroke="#818CF8" stroke-width="1.5" />
    <circle cx="915" cy="130" r="3.5" fill="#1E293B" stroke="#334155" stroke-width="1.5" />

    <!-- Core Center Node (Pulsing Evidence Anchor) -->
    <circle cx="820" cy="110" r="8" fill="#38BDF8" class="pulsing-node" />
    <circle cx="820" cy="110" r="4" fill="#FFFFFF" />
  </g>

  <!-- Content (Left Side) -->
  <g transform="translate(56, 44)">
    <!-- Status / Discipline Pill -->
    <g transform="translate(0, 0)">
      <rect width="186" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <circle cx="14" cy="12" r="3.5" fill="#10B981" class="status-dot" />
      <text x="26" y="16" class="text-badge">AI SYSTEMS &amp; EVAL</text>
    </g>

    <!-- Name Header -->
    <text x="0" y="60" class="text-title">Raaid Khan</text>

    <!-- Subtitle Roles -->
    <text x="0" y="88" class="text-subtitle">AI/ML Engineer <tspan fill="#475569">|</tspan> Data Scientist</text>

    <!-- Technical Pillars / Focus -->
    <g transform="translate(0, 118)">
      <text x="0" y="0" class="text-meta">LLMs &amp; RAG  &bull;  Agent Architecture  &bull;  AI Evaluation  &bull;  Deterministic Safety</text>
    </g>
  </g>
</svg>
